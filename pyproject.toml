[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qdspectra"
version = "0.1.0"
description = "Tight-binding pi-electron model of graphene quantum dots: exact Huckel spectra of nanoflakes, gap-size scaling, and size-distribution-averaged emission line shapes"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Be24002" }]
keywords = ["physics", "graphene", "quantum-dots", "tight-binding", "huckel", "photoluminescence"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
